<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="LedgerForge: a self-verifying RL environment for financial-audit agents">
<title>LedgerForge</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#0f1b2d"/><stop offset="1" stop-color="#062a24"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
    <stop offset="0" stop-color="#10b981" stop-opacity="0.25"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
  </pattern>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect width="1200" height="380" rx="20" fill="url(#bg)"/>
<rect width="1200" height="380" rx="20" fill="url(#grid)"/>
<rect width="1200" height="380" rx="20" fill="url(#glow)"/>

<!-- logo mark: stacked ledger sheets with a check -->
<g transform="translate(64 70)">
  <rect x="8" y="8" width="56" height="64" rx="8" fill="#10b981" fill-opacity="0.25"/>
  <rect x="0" y="0" width="56" height="64" rx="8" fill="#10b981"/>
  <rect x="10" y="14" width="36" height="4" rx="2" fill="#062a24"/>
  <rect x="10" y="24" width="28" height="4" rx="2" fill="#062a24"/>
  <path d="M14 42l8 8 16-16" fill="none" stroke="#062a24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="152" y="122" font-size="60" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">LedgerForge</text>
<text x="66" y="182" font-size="24" fill="#cbd5e1">A causal, self-verifying RL environment</text>
<text x="66" y="214" font-size="24" fill="#cbd5e1">for <tspan fill="#34d399" font-weight="700">financial-audit agents</tspan></text>

<!-- stat chips -->
<g font-size="15" font-weight="600">
  <rect x="66" y="252" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="141" y="277" text-anchor="middle" fill="#e2e8f0"><tspan fill="#f87171">4</tspan> fault types</text>
  <rect x="228" y="252" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="323" y="277" text-anchor="middle" fill="#e2e8f0"><tspan fill="#fbbf24">7</tspan> look-alike families</text>
  <rect x="430" y="252" width="190" height="40" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="525" y="277" text-anchor="middle" fill="#e2e8f0"><tspan fill="#34d399">20/20</tspan> metamorphic pairs</text>
</g>
<text x="66" y="332" font-size="14" fill="#64748b">Offline · CPU-only · Python standard library · deterministic seeds · isolated evaluator</text>

<!-- ledger card -->
<g transform="translate(720 56)">
  <rect width="420" height="268" rx="14" fill="#0b1220" fill-opacity="0.85" stroke="#334155"/>
  <circle cx="22" cy="20" r="5" fill="#f87171"/><circle cx="40" cy="20" r="5" fill="#fbbf24"/><circle cx="58" cy="20" r="5" fill="#34d399"/>
  <text x="400" y="25" text-anchor="end" class="mono" font-size="12" fill="#64748b">ledger.csv</text>
  <g class="mono" font-size="12.5">
    <text x="20" y="62" fill="#64748b">row_id    account            debit       credit</text>
    <line x1="20" x2="400" y1="72" y2="72" stroke="#1e293b"/>
    <text x="20" y="96" fill="#cbd5e1">R2198597  1300 Inventory    3,208,276        —</text>
    <text x="20" y="122" fill="#cbd5e1">R2680563  2100 AP                  —  3,208,276</text>
    <rect x="12" y="134" width="396" height="30" rx="6" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.6"/>
    <text x="20" y="154" fill="#fecaca">R5061322  5100 Materials   1,912,400        —</text>
    <text x="20" y="186" fill="#cbd5e1">R5061323  2100 AP                  —  1,912,400</text>
    <text x="20" y="212" fill="#cbd5e1">R7310045  1010 Bank                —    950,000</text>
  </g>
  <g transform="translate(20 230)">
    <rect width="250" height="26" rx="13" fill="#ef4444" fill-opacity="0.18"/>
    <text x="12" y="17" class="mono" font-size="12" fill="#fca5a5">fx_rate · booked at the wrong date</text>
  </g>
  <g transform="translate(282 230)">
    <rect width="118" height="26" rx="13" fill="#10b981" fill-opacity="0.18"/>
    <text x="59" y="17" text-anchor="middle" class="mono" font-size="12" fill="#6ee7b7">reward +0.96</text>
  </g>
</g>
</svg>
